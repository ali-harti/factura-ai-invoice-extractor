<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Mukta:wght@200;300;400;500;600;700;800&family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <title>Factura</title>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F9F9F8; z-index: 9999;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fadeIn 0.5s ease-in-out;">
          <div style="position: relative; display: flex; align-items: center; justify-content: center;">
            <div style="position: absolute; width: 60px; height: 60px; border-radius: 50%; background-color: #D47A5A; opacity: 0.1; animation: pulse 2s infinite ease-in-out;"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D47A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1.5s linear infinite; position: relative; z-index: 1;">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
          </div>
          <p style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: #1E1E1E; opacity: 0.7; letter-spacing: 0.05em; text-transform: uppercase;">
            Loading Factura...
          </p>
        </div>
        <style>
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.2; } 50% { transform: scale(1.5); opacity: 0.05; } 100% { transform: scale(0.8); opacity: 0.2; } }
          @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
          @media (prefers-color-scheme: dark) {
            #root > div { background-color: #1A1A1A !important; }
            #root > div p { color: #EAEAEA !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
