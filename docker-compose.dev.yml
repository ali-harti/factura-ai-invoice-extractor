version: "3.9"

services:
  postgres:
    ports:
      - "5432:5432"

  api:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - invoice_storage:/data/invoices

  frontend:
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
